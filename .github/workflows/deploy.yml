name: Deploy Docusaurus

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test shared Java runtime
        run: npm run test:simulator

      - name: Audit simulator pages
        run: npm run test:simulator:audit

      - name: Check curriculum content
        run: npm run check:content

      - name: Test access and search behavior
        run: npm run test:site

      - name: Build
        env:
          TELEMARK_ADMIN_EMAIL: ${{ vars.TELEMARK_ADMIN_EMAIL }}
          TELEMARK_BASE_URL: /${{ github.event.repository.name }}/
          TELEMARK_BUILD_COMMIT: ${{ github.sha }}
          TELEMARK_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Verify production build
        run: npm run verify:build

      - name: Build and verify staged redirects
        run: npm run test:redirects

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ vars.TELEMARK_REDIRECTS_ENABLED == 'true' && './redirect-build' || './build' }}

      - name: Smoke test deployed site
        if: vars.TELEMARK_REDIRECTS_ENABLED != 'true'
        env:
          TELEMARK_BUILD_COMMIT: ${{ github.sha }}
          TELEMARK_DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run smoke:deployed

      - name: Smoke test deployed redirects
        if: vars.TELEMARK_REDIRECTS_ENABLED == 'true'
        env:
          TELEMARK_DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run smoke:redirects

  deploy-functions:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELEMARK }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      TELEMARK_ADMIN_EMAIL: ${{ vars.TELEMARK_ADMIN_EMAIL }}
      TELEMARK_ALLOWED_ORIGINS: ${{ vars.TELEMARK_ALLOWED_ORIGINS != '' && vars.TELEMARK_ALLOWED_ORIGINS || format('https://{0}.github.io,https://telemarkfirst.github.io', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate to Google Cloud
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GA4_PROPERTY_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELEMARK }}

      - name: Install site tooling
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GA4_PROPERTY_ID != ''
        run: npm ci

      - name: Install function dependencies
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GA4_PROPERTY_ID != ''
        run: npm ci --prefix functions

      - name: Deploy secure analytics function
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GA4_PROPERTY_ID != ''
        run: npm run deploy:functions
